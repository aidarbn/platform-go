# Generated by platformgo from platformgo.yaml. Do not edit.
# Static queries: put them into db/sqlc/queries/*.sql and run make generate.
version: "2"
sql:
  - engine: postgresql
    schema: ../migrations
    queries: queries
    gen:
      go:
        package: sqlcgen
        out: ../../internal/adapters/out/db/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_interface: false
        rename:
          sku: SKU
          url: URL
        overrides:
          # From platformgo.yaml; they come first, and sqlc takes the first match.
          - db_type: int4
            go_type: int64
          - db_type: int4
            nullable: true
            go_type: { type: int64, pointer: true }
          - db_type: numeric
            go_type: float64
          - db_type: numeric
            nullable: true
            go_type: { type: float64, pointer: true }
          - column: orders.meta
            go_type: { import: example.com/app/internal/domain, package: domain, type: Meta }
          - db_type: text
            nullable: true
            go_type: { type: string, pointer: true }
          - db_type: "true"
            go_type: "1"
          - db_type: "0x1F"
            go_type: "1_000"
          # Money and percentages are exact: numeric is never a float.
          - db_type: pg_catalog.numeric
            go_type: { import: github.com/shopspring/decimal, type: Decimal }
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { import: github.com/shopspring/decimal, type: NullDecimal }
          - db_type: uuid
            go_type: { import: github.com/google/uuid, type: UUID }
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: jsonb
            go_type: { import: encoding/json, type: RawMessage }
          - db_type: jsonb
            nullable: true
            go_type: { import: encoding/json, type: RawMessage }
          - db_type: timestamptz
            go_type: { import: time, type: Time }
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: date
            go_type: { import: time, type: Time }
          - db_type: date
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
