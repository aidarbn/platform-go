# Test service of the api module. Regenerate with: make proto-test
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: .
    opt: [paths=source_relative]
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt: [paths=source_relative]
  - local: ["go", "run", "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.30.0"]
    out: .
    opt: [paths=source_relative]
