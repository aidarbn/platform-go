syntax = "proto3";

package apidoc.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "example.com/shop/gen/apidoc/v1;apidocv1";
// Shared options: tags and their groups.
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Shop API"
    version: "2"
    description: "The shop.\n\nTwo paragraphs."
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "A token."
      }
    }
    security: {
      key: "Key"
      value: {
        type: TYPE_API_KEY
        in: IN_QUERY
        name: "key"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  tags: {
    name: "Products"
    description: "Products and their prices."
  }
  extensions: {
    key: "x-tagGroups"
    value: {
      list_value: {
        values: {
          struct_value: {
            fields: {
              key: "name"
              value: {string_value: "Catalog"}
            }
            fields: {
              key: "tags"
              value: {
                list_value: {
                  values: {string_value: "Products"}
                }
              }
            }
          }
        }
      }
    }
  }
};
