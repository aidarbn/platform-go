# Generated by platformgo from platformgo.yaml. Do not edit.
version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/gnostic/gnostic
    - file_option: go_package
      path: platform
  override:
    - file_option: go_package_prefix
      value: github.com/aidarbn/shop-api/internal/api/gen
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-go-grpc]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-grpc-gateway]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-connect-openapi]
    out: api/openapi
    strategy: all
    opt:
      # REST paths from google.api.http, validation rules from protovalidate, and
      # descriptions from gnostic annotations. connectrpc stays off: the gateway does
      # not serve Connect paths, so they must not be documented.
      - features=google.api.http;protovalidate;gnostic
      - with-proto-names
      - path=openapi.yaml
      # The human part of the description: title, intro, tags, security scheme.
      - base=api/openapi/base.yaml
      # Sections in the docs page come from gnostic tags in the proto and their
      # descriptions from the base file; the service itself is not a section, or every
      # method would be listed twice.
      - without-default-tags
      - short-operation-ids
inputs:
  - directory: proto
    exclude_paths:
      - proto/platform
