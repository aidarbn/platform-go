            format: int64
        - name: maybe_email
          in: query
          description: |-
            Rules:
            - the rules do not apply to an empty value
          schema:
            anyOf:
              - type: string
                format: email
              - const: ""
        - name: few
          in: query
          description: |-
            Rules:
            - the rules do not apply to an empty value
          schema:
            anyOf:
              - type: array
                items:
                  type: string
                minItems: 2
              - const: []
        - name: chosen
          in: query
          schema:
            type: integer
            format: int64
            enum:
              - 1
              - 2
        - name: seven
          in: query
          schema:
            type: integer
            format: uint64
            enum:
              - 7
        - name: not_five
          in: query
          description: |-
            Rules:
            - the bounds hold for the string form too, which JSON Schema checks on numbers only
          schema:
            type: integer
            format: int64
            minimum: 0
            not:
              enum:
                - 5
        - name: both
          in: query
          schema:
            type: string
            pattern: ^a
            allOf:
              - not:
                  enum:
                    - c
              - pattern: ^[0-9a-fA-F]{32}$
            not:
              pattern: b
        - name: by_id
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
            propertyNames:
              pattern: ^-?[0-9]+$
        - name: lvl
          in: query
          description: |-
            Rules:
            - the rules do not apply to an empty value
          schema:
            anyOf:
              - $ref: '#/components/schemas/rules.v1.Level'
              - const: LEVEL_UNSPECIFIED
        - name: big_zero
          in: query
          description: |-
            Rules:
            - the bounds hold for the string form too, which JSON Schema checks on numbers only
            - the rules do not apply to an empty value
          schema:
            anyOf:
              - type: integer
                format: int64
                exclusiveMinimum: 10
              - enum:
                  - 0
        - name: named
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
            propertyNames:
              minLength: 1
        - name: opt_email
          in: query
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rules.v1.CheckResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/stream:
    post:
      tags:
        - RulesService
      summary: Upload
      operationId: RulesService_Upload
      requestBody:
        description: 'A stream: one JSON object a line.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rules.v1.CheckResponseInput'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rules.v1.CheckResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/values:
    put:
      tags:
        - RulesService
      summary: Put
      operationId: RulesService_Put
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rules.v1.CheckResponseInput'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /v1/values/{value}:
    delete:
      tags:
        - RulesService
      summary: Del
      operationId: RulesService_Del
      parameters:
        - name: value
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rules.v1.CheckResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    Error:
      type: object
      description: 'The error body: google.rpc.Status.'
      properties:
        code:
          type: integer
          format: int32
          description: 'The gRPC code: 3 is INVALID_ARGUMENT, 5 NOT_FOUND, 7 PERMISSION_DENIED, 16 UNAUTHENTICATED.'
        message:
          type: string
          description: What went wrong, in the language of the request when the i18n module translates it.
        details:
          type: array
          description: 'Details by their @type: buf.validate.Violations for a request that failed validation, google.rpc.ErrorInfo with a reason.'
          items:
            anyOf:
              - $ref: '#/components/schemas/buf.validate.Violations'
              - $ref: '#/components/schemas/google.rpc.ErrorInfo'
              - type: object
                properties:
                  '@type':
                    type: string
                required:
                  - '@type'
      required:
        - code
        - message
        - details
    buf.validate.FieldPath:
      type: object
      description: A path to a field, from the request message down.
      properties:
        elements:
          type: array
          items:
            type: object
            properties:
              field_number:
                type: integer
                format: int32
              field_name:
                type: string
              field_type:
                type: string
                description: The type of the field, TYPE_STRING and the like.
              key_type:
                type: string
              value_type:
                type: string
              index:
                type: string
                format: uint64
                description: The position in a list.
              bool_key:
                type: boolean
              int_key:
                type: string
                format: int64
              uint_key:
                type: string
                format: uint64
              string_key:
                type: string
    buf.validate.Violations:
      type: object
      description: The rules a request breaks.
      properties:
        '@type':
          const: type.googleapis.com/buf.validate.Violations
        violations:
          type: array
          items:
            type: object
            properties:
              field:
                oneOf:
                  - $ref: '#/components/schemas/buf.validate.FieldPath'
                  - type: "null"
              rule:
                oneOf:
                  - $ref: '#/components/schemas/buf.validate.FieldPath'
                  - type: "null"
              rule_id:
                type: string
                description: The rule, string.min_len and the like.
              message:
                type: string
                description: What is wrong with the field.
              for_key:
                type: boolean
      required:
        - '@type'
    google.rpc.ErrorInfo:
      type: object
      description: Why the call failed, as a constant a client can check.
      properties:
        '@type':
          const: type.googleapis.com/google.rpc.ErrorInfo
        reason:
          type: string
          description: EXTERNAL_UNAVAILABLE, EXTERNAL_TIMEOUT or a reason of the service.
        domain:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - '@type'
    rules.v1.CheckRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        host:
          type: string
          format: hostname
        v4:
          type: string
          format: ipv4
        v6:
          type: string
          format: ipv6
        ref:
          type: string
          format: uri-reference
        tuuid:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
        ulid:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
        ip:
          type: string
          description: |-
            Rules:
            - an IPv4 or IPv6 address
        address:
          type: string
          description: |-
            Rules:
            - a hostname or an IP address
        host_port:
          type: string
          description: |-
            Rules:
            - a host and a port, host:port
        cidr:
          type: string
          description: |-
            Rules:
            - an IP address with a prefix length
        prefix:
          type: string
          description: |-
            Rules:
            - an IP prefix
        fqn:
          type: string
          description: |-
            Rules:
            - a fully qualified protobuf name
        header_name:
          type: string
          description: |-
            Rules:
            - an HTTP header name
        header_value:
          type: string
          description: |-
            Rules:
            - an HTTP header value
        fixed:
          type: string
          description: |-
            Rules:
            - exactly 1 bytes in UTF-8
            - at least 1 bytes in UTF-8
          const: x
          minLength: 1
          maxLength: 1
        many:
          type: string
          pattern: ^[a-z]+$
          allOf:
            - pattern: \.go$
            - pattern: _
          not:
            pattern: --
        not_these:
          type: string
          not:
            enum:
              - a
              - b
        blob:
          type: string
          format: byte
          description: |-
            Rules:
            - exactly 4 bytes
            - at least 1 bytes
            - at most 8 bytes
            - matches `^.+$`
          contentEncoding: base64
        addr:
          type: string
          format: byte
          description: |-
            Rules:
            - an IPv4 address in bytes
          contentEncoding: base64
        addr6:
          type: string
          format: byte
          description: |-
            Rules:
            - an IPv6 address in bytes
          contentEncoding: base64
        addr_any:
          type: string
          format: byte
          description: |-
            Rules:
            - an IP address in bytes
          contentEncoding: base64
        id:
          type: string
          format: byte
          description: |-
            Rules:
            - a UUID in bytes
          contentEncoding: base64
        ratio:
          type: number
          format: float
          description: |-
            Rules:
            - a finite number
          enum:
            - 0.1
            - 0.5
          examples:
            - 0.1
        outside:
          type:
            - integer
            - string
          format: int64
          description: |-
            Rules:
            - outside of 5…10
        picked:
          type: integer
          format: int32
          const: 4
          not:
            enum:
              - 3
        small:
          type:
            - integer
            - string
          format: int64
          description: |-
            Rules:
            - the bounds hold for the string form too, which JSON Schema checks on numbers only
          minimum: -9
          maximum: 0
        level:
          $ref: '#/components/schemas/rules.v1.Level'
          const: LEVEL_HIGH
        levels:
          $ref: '#/components/schemas/rules.v1.Level'
          enum:
            - LEVEL_LOW
            - LEVEL_HIGH
        yes:
          type: boolean
          const: true
        past:
          type: string
          format: date-time
          description: |-
            Rules:
            - lt_now
        short:
          type: string
          description: |-
            Rules:
            - lt 60s
          pattern: ^-?[0-9]+(\.[0-9]{1,9})?s$
          examples:
            - 1.5s
        packed:
          type: object
          description: |-
            Rules:
            - in type.googleapis.com/rules.v1.CheckRequest
          properties:
            '@type':
              type: string
              description: The type of the message, type.googleapis.com/<full name>.
          required:
            - '@type'
        flags:
          type: object
          additionalProperties:
            type: string
            minLength: 2
          propertyNames:
            enum:
              - "true"
              - "false"
          minProperties: 1
        ids:
          type: array
          description: |-
            Rules:
            - item: `this % 2 == 0`
            - item: the bounds hold for the string form too, which JSON Schema checks on numbers only
          items:
            type:
              - integer
              - string
            format: int64
            exclusiveMinimum: 0
          minItems: 1
        skipped:
          type: string
        checked:
          type: string
          description: |-
            Rules:
            - `this != 'x'`
        list:
          type: array
          items: {}
        nothing:
          type: "null"
        times:
          type: array
          items:
            type: string
            format: date-time
        wrapped:
          type:
            - integer
            - string
          format: int64
        maybe_email:
          description: |-
            Rules:
            - the rules do not apply to an empty value
          anyOf:
            - type: string
              format: email
            - const: ""
        few:
          description: |-
            Rules:
            - the rules do not apply to an empty value
          anyOf:
            - type: array
              items:
                type: string
              minItems: 2
            - const: []
        chosen:
          type:
            - integer
            - string
          format: int64
          enum:
            - 1
            - 2
            - "1"
            - "2"
        seven:
          type:
            - integer
            - string
          format: uint64
          enum:
            - 7
            - "7"
        not_five:
          type:
            - integer
            - string
          format: int64
          description: |-
            Rules:
            - the bounds hold for the string form too, which JSON Schema checks on numbers only
          minimum: 0
          not:
            enum:
              - 5
              - "5"
        both:
          type: string
          pattern: ^a
          allOf:
            - not:
                enum:
                  - c
            - pattern: ^[0-9a-fA-F]{32}$
          not:
            pattern: b
        by_id:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            pattern: ^-?[0-9]+$
        lvl:
          description: |-
            Rules:
            - the rules do not apply to an empty value
          anyOf:
            - $ref: '#/components/schemas/rules.v1.Level'
              enum:
                - LEVEL_LOW
            - const: LEVEL_UNSPECIFIED
        big_zero:
          description: |-
            Rules:
            - the bounds hold for the string form too, which JSON Schema checks on numbers only
            - the rules do not apply to an empty value
          anyOf:
            - type:
                - integer
                - string
              format: int64
              exclusiveMinimum: 10
            - enum:
                - 0
                - "0"
        named:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            minLength: 1
        opt_email:
          type: string
          format: email
    rules.v1.CheckResponse:
      type: object
      properties:
        a:
          type: string
        b:
          type: string
        c:
          type: string
        any: {}
        self:
          oneOf:
            - $ref: '#/components/schemas/rules.v1.CheckResponse'
            - type: "null"
      required:
        - a
        - b
        - c
        - any
        - self
      additionalProperties: false
    rules.v1.CheckResponseInput:
      type: object
      description: |-
        Rules:
        - exactly one of `a`, `b`
        - at most one of `a`, `c`
      properties:
        a:
          type: string
        b:
          type: string
        c:
          type: string
        any: {}
        self:
          $ref: '#/components/schemas/rules.v1.CheckResponseInput'
    rules.v1.Level:
      type: string
      enum:
        - LEVEL_UNSPECIFIED
        - LEVEL_LOW
        - LEVEL_HIGH
  responses:
    Error:
      description: |-
        An error. The HTTP status follows the gRPC code of the error:

        - 400 — INVALID_ARGUMENT (the details hold the violations of the request), FAILED_PRECONDITION, OUT_OF_RANGE
        - 401 — UNAUTHENTICATED
        - 403 — PERMISSION_DENIED
        - 404 — NOT_FOUND
        - 409 — ALREADY_EXISTS, ABORTED
        - 413 — the body is larger than the service accepts
        - 429 — RESOURCE_EXHAUSTED: the rate limit
        - 499 — CANCELLED
        - 500 — INTERNAL, UNKNOWN, DATA_LOSS
        - 501 — UNIMPLEMENTED
        - 502 — UNAVAILABLE because an external provider failed (an ErrorInfo with the reason EXTERNAL_UNAVAILABLE)
        - 503 — UNAVAILABLE
        - 504 — DEADLINE_EXCEEDED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
