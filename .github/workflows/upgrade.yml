name: platform upgrade

# Moves a project to the latest platform release and opens a pull request with the
# result. Projects call it from a small workflow of their own, so the runner, the base
# branch and the naming rules stay theirs:
#
#   jobs:
#     upgrade:
#       uses: aidarbn/platform-go/.github/workflows/upgrade.yml@v0.5.11
#       permissions: { contents: write, pull-requests: write, actions: write }
#       with:
#         base: dev
#
# The upgrade is `platformgo upgrade`: go get, then apply by the new version —
# generated files, pinned tools, codemods, the lock. Nothing happens when the project
# is already on the latest release.
#
# The CI run of a pull request opened with the workflow token waits for approval (a
# GitHub rule against loops); the workflow approves it, so the checks show up on the
# pull request. When approval is not allowed, the project CI is started on the branch
# by workflow_dispatch and reports on the commit. With the `token` secret — a token
# that may start workflows — the pull request starts CI the usual way.

on:
  workflow_call:
    inputs:
      runs-on:
        description: runner labels as JSON, e.g. '["self-hosted", "linux"]'
        type: string
        default: '"ubuntu-latest"'
      base:
        description: branch to upgrade and to open the pull request against; the default branch when empty
        type: string
        default: ""
      version:
        description: platform version to move to
        type: string
        default: latest
      branch-prefix:
        description: name of the upgrade branch before the version
        type: string
        default: platform-upgrade/
      title:
        description: commit and pull request title; {from} and {to} are replaced
        type: string
        default: "chore: platform-go {from} → {to}"
      ci-workflow:
        description: workflow file of the project CI, started on the branch; empty skips it
        type: string
        default: ci.yml
    secrets:
      token:
        description: a token that may start workflows; the workflow token otherwise
        required: false

jobs:
  upgrade:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    env:
      MODULE: github.com/aidarbn/platform-go
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base || github.event.repository.default_branch }}
          token: ${{ secrets.token || github.token }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Upgrade
        id: upgrade
        run: |
          from=$(go list -m -f '{{.Version}}' "$MODULE")
          go tool platformgo upgrade "${{ inputs.version }}"
          to=$(go list -m -f '{{.Version}}' "$MODULE")
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to" >> "$GITHUB_OUTPUT"
          if [ "$from" = "$to" ] && git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "already on $to"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Quick checks that need no database; the full checks are the project CI.
      - name: Checks
        id: checks
        if: steps.upgrade.outputs.changed == 'true'
        continue-on-error: true
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go tool platformgo verify

      - name: Branch
        id: branch
        if: steps.upgrade.outputs.changed == 'true'
        env:
          FROM: ${{ steps.upgrade.outputs.from }}
          TO: ${{ steps.upgrade.outputs.to }}
          TITLE_TEMPLATE: ${{ inputs.title }}
          BRANCH: ${{ inputs.branch-prefix }}${{ steps.upgrade.outputs.to }}
        run: |
          title=${TITLE_TEMPLATE//\{from\}/$FROM}
          title=${title//\{to\}/$TO}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "$title"
          # The branch belongs to the workflow: a rerun replaces it with a fresh upgrade.
          git push --force origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # The GitHub API through github-script rather than the gh command: it needs nothing
      # on the runner beyond what every runner has, and self-hosted runners often lack gh.
      - name: Pull request
        if: steps.upgrade.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          FROM: ${{ steps.upgrade.outputs.from }}
          TO: ${{ steps.upgrade.outputs.to }}
          BASE: ${{ inputs.base || github.event.repository.default_branch }}
          BRANCH: ${{ steps.branch.outputs.name }}
          TITLE: ${{ steps.branch.outputs.title }}
          CHECKS: ${{ steps.checks.outcome }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const { FROM, TO, BASE, BRANCH, TITLE, CHECKS, CI_WORKFLOW, HAS_TOKEN } = process.env;
            const { owner, repo } = context.repo;
            const passed = CHECKS === 'success';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Platform upgrade ${FROM} → ${TO} by \`platformgo upgrade\`: generated files, pinned tools, codemods and the lock come from the new version.`,
              '',
              passed
                ? '- Quick checks: build, vet and `platformgo verify` pass.'
                : `- Quick checks: **build, vet or \`platformgo verify\` failed**, see the [workflow run](${run}); the pull request is a draft.`,
              `- Release notes: https://github.com/aidarbn/platform-go/releases/tag/${TO}`,
              `- Workflow run: ${run}`,
            ].join('\n');

            const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${BRANCH}` });
            let pr;
            if (open.data.length > 0) {
              pr = (await github.rest.pulls.update({ owner, repo, pull_number: open.data[0].number, title: TITLE, body })).data;
            } else {
              pr = (await github.rest.pulls.create({ owner, repo, base: BASE, head: BRANCH, title: TITLE, body, draft: !passed })).data;
            }
            core.notice(`pull request: ${pr.html_url}`);

            if (HAS_TOKEN === 'true' || !CI_WORKFLOW) return;

            // A pull request opened by the workflow token gets its CI run created but
            // waiting for approval, like one from a first time contributor. Approving it
            // is what makes the checks show up on the pull request; when that is not
            // allowed, CI is started on the branch instead and reports on the commit.
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            for (let i = 0; i < 12; i++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: CI_WORKFLOW, branch: BRANCH, event: 'pull_request', head_sha: pr.head.sha,
              });
              const waiting = runs.data.workflow_runs.filter((r) => r.conclusion === 'action_required' || r.status === 'waiting');
              if (waiting.length > 0) {
                try {
                  for (const r of waiting) await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', { owner, repo, run_id: r.id });
                  core.notice(`approved ${CI_WORKFLOW} on the pull request`);
                  return;
                } catch (e) {
                  core.warning(`could not approve the CI run (${e.message}); starting it on the branch`);
                  break;
                }
              }
              if (runs.data.workflow_runs.some((r) => r.status !== 'completed')) {
                core.notice(`${CI_WORKFLOW} already runs on the pull request`);
                return;
              }
              await sleep(5000);
            }
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: CI_WORKFLOW, ref: BRANCH });
              core.notice(`${CI_WORKFLOW} started on ${BRANCH}; its checks are on the commit`);
            } catch (e) {
              core.warning(`${CI_WORKFLOW} was not started (${e.message}): it needs a workflow_dispatch trigger`);
            }
