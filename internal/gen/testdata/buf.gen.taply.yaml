# Generated by platformgo from platformgo.yaml. Do not edit.
version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/grpc-ecosystem/grpc-gateway
    - file_option: go_package
      path: platform
  override:
    - file_option: go_package_prefix
      value: github.com/aidarbn/shop-api/internal/api/gen
plugins:
  - local: [go, tool, protoc-gen-go]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-go-grpc]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-grpc-gateway]
    out: internal/api/gen
    opt: [paths=source_relative]
  - local: [go, tool, protoc-gen-platform-openapi]
    out: api/openapi
    strategy: all
    opt:
      # The human part of the description: title, intro, tags, security scheme. The
      # plugin writes openapi.yaml with the paths of every proto file in a yaml of its
      # own next to it, common.yaml, and openapi.bundle.yaml, which the service serves.
      - base=api/openapi/base.yaml
inputs:
  - directory: api
    exclude_paths:
      - api/platform
