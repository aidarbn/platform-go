name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: platformgo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      S3_TEST_ENDPOINT: localhost:9000
      # Tests marked RealDatabase run only with this set; in CI they always run.
      DATABASE_TEST_URL: postgres://postgres:pg@localhost:5432/platformgo?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # The exported API of kit against the latest release; a release tag fails when it
  # ships an incompatible change its version does not allow.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: startsWith(github.ref, 'refs/tags/')
        run: scripts/apicheck.sh "" "$GITHUB_REF_NAME"
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: scripts/apicheck.sh

  # Projects created by the last releases move to this checkout and must still apply,
  # verify, build and pass their tests.
  upgrade-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/upgrade-matrix.sh $(git tag --list 'v*' --sort=-v:refname | head -3)
