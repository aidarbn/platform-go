syntax = "proto3";

// Test service of the api module: one call that validates and answers, one that fails on
// demand, so the tests cover the interceptors and the gateway end to end.
package platformtest.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/aidarbn/platform-go/kit/internal/testapi/platformtest/v1;platformtestv1";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/echo"
      body: "*"
    };
  }

  rpc Fail(FailRequest) returns (FailResponse) {
    option (google.api.http) = {get: "/v1/fail/{kind}"};
  }

  // Files over multipart/form-data through the gateway.
  rpc Upload(UploadRequest) returns (UploadResponse) {
    option (google.api.http) = {
      post: "/v1/upload"
      body: "*"
    };
  }

  // A method kept for old clients.
  rpc OldEcho(EchoRequest) returns (EchoResponse) {
    option deprecated = true;
    option (google.api.http) = {
      post: "/v1/old-echo"
      body: "*"
    };
  }

  // Every form of JSON the gateway writes, for the test of the OpenAPI description:
  // full=true sets every field, without it every field keeps its zero value.
  rpc Kinds(KindsRequest) returns (KindsResponse) {
    option (google.api.http) = {get: "/v1/kinds/{id}"};
  }

  // A method that creates something, for idempotency.
  rpc CreateThing(CreateThingRequest) returns (CreateThingResponse) {
    option (google.api.http) = {
      post: "/v1/things"
      body: "*"
    };
  }
}

message File {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
}

message Meta {
  string author = 1;
}

message UploadRequest {
  string title = 1;
  File avatar = 2;
  repeated File images = 3;
  Meta meta = 4;
}

message UploadResponse {
  string title = 1;
  string avatar_name = 2;
  int32 avatar_size = 3;
  repeated string images = 4;
  string author = 5;
  string avatar_type = 6;
}

message CreateThingRequest {
  string name = 1;
}

message CreateThingResponse {
  string id = 1;
  int32 calls = 2;
}

message EchoRequest {
  string message_text = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
}

message EchoResponse {
  string message_text = 1;
  int32 length = 2;
  bool shouted = 3;
}

message FailRequest {
  // panic, internal, not_found or slow
  string kind = 1;
}

message FailResponse {}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message KindsRequest {
  int64 id = 1;
  bool full = 2;
  Color color = 3;
  repeated string tags = 4;
}

message KindsResponse {
  int64 id = 1;
  uint64 big = 2;
  int32 small = 3;
  double ratio = 4;
  float part = 5;
  bool flag = 6;
  string text = 7;
  bytes data = 8;
  Color color = 9;
  repeated string tags = 10;
  map<string, int64> counts = 11;
  Meta meta = 12;
  optional string note = 13;
  oneof choice {
    string word = 14;
    int32 number = 15;
  }
  google.protobuf.Timestamp at = 16;
  google.protobuf.Duration took = 17;
  google.protobuf.StringValue maybe = 18;
  google.protobuf.Struct extra = 19;
  google.protobuf.Value anything = 20;
  repeated Meta metas = 21;
  google.protobuf.FieldMask mask = 22;
  google.protobuf.Any packed = 23;
  google.protobuf.Empty nothing = 24;
  map<int32, Meta> by_number = 25;
  sint64 negative = 26;
  fixed32 unsigned = 27;
}
